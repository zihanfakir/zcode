name: Build Android APK & Release

on:
  push:
    branches: ["master", "main"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android Release APK
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/ZCode-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-Android-APK
          path: release-output/ZCode-v1.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Z-Code v1.0.0 - Android APK & Web Release"
          body: |
            ## 📱 Z-Code Android App (v1.0.0)

            - **Circular 2D Barcode Generator & Scanner**
            - **100% Offline Direct Optical Architecture** (Zero network required)
            - **Reed-Solomon RS(85, 71)** Forward Error Correction
            - **AES-256-GCM + PBKDF2** Password Protection
            - **Live CameraX Scanner** with 360° circular viewfinder

            ### 📥 Download:
            Download **`ZCode-v1.0.0.apk`** below and install it directly on your Android phone!
          files: release-output/ZCode-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
